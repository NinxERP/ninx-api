name: Deploy to Azure

on:
  push:
    branches: [main]

env:
  API_RESOURCE_GROUP: Ninx-API
  SQL_RESOURCE_GROUP: Ninx-DB
  SQL_SERVER: ninx
  CONTAINER_APP: ninx-api
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ninx-api

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Allow this runner through SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group $SQL_RESOURCE_GROUP \
            --server $SQL_SERVER \
            --name gh-actions-runner \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: src
        run: dotnet restore ninx.Api/ninx.Api.csproj

      - name: Run EF Core migrations
        working-directory: src
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project ninx.Data \
            --startup-project ninx.Api \
            --connection "${{ secrets.DB_CONNECTION_STRING }}"

      - name: Remove firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group $SQL_RESOURCE_GROUP \
            --server $SQL_SERVER \
            --name gh-actions-runner || true

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $API_RESOURCE_GROUP \
            --image ${{ env.IMAGE }}:${{ github.sha }}
